name: LokiVerse Windows + Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run validation tests
        run: npm run check
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LokiVerse-Windows-CI
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build TEST Android APK (debug-signed; not update-stable)
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: LokiShare-Android-TEST-CI
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
