name: LokiVerse GitHub Release (Windows + Android test)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must be v$version" }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source + tests
        run: npm run check
      - name: Build Windows installer with unchanged app identity
        run: npm run dist:win
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sha  $($_.Name)" | Out-File release/SHA256SUMS.txt -Append -Encoding utf8
          }
      - name: Publish official Windows Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
  android-test-release:
    runs-on: ubuntu-latest
    needs: windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3's default SDK package list may include the removed legacy `tools` package.
      # v4 installs only the current SDK packages (explicitly excluding `tools`).
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - name: Build Android test APK
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Label build clearly as TEST ONLY
        shell: bash
        run: |
          mkdir -p android-out
          cp android-companion/app/build/outputs/apk/debug/*.apk android-out/LokiShare-0.4.0-Android-TEST.apk
          (cd android-out && sha256sum *.apk > SHA256SUMS-ANDROID-TEST.txt)
      - name: Attach test-only Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-out/LokiShare-0.4.0-Android-TEST.apk
            android-out/SHA256SUMS-ANDROID-TEST.txt
          fail_on_unmatched_files: true
