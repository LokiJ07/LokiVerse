name: LokiVerse GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate that Git tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must be v$version" }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run validation tests
        run: npm run check
      - name: Build the stable-identity Windows NSIS installer
        run: npm run dist:win
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sha  $($_.Name)" | Out-File release/SHA256SUMS.txt -Append -Encoding utf8
          }
      - name: Publish GitHub Release (uses built-in GITHUB_TOKEN)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
