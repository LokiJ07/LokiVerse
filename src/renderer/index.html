<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>LokiVerse — Your space to create</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="background-glow glow-a"></div><div class="background-glow glow-b"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">L<span>✦</span></div><div><strong>LokiVerse</strong><small>THE CREATOR SPACE</small></div></div>
      <div class="sidebar-section">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-button active" data-view="home"><span data-icon="home"></span> Overview <span class="nav-indicator"></span></button>
        <button class="nav-button" data-view="tasks"><span data-icon="tasks"></span> My Tasks</button>
        <button class="nav-button" data-view="notes"><span data-icon="notes"></span> LokiNotes</button>
        <button class="nav-button" data-view="files"><span data-icon="folder"></span> LokiFiles</button>
      </nav>
      <div class="sidebar-section tools-heading">TOOLS & MORE</div>
      <nav>
        <button class="nav-button" data-view="monitor"><span data-icon="activity"></span> SystemPulse</button>
        <button class="nav-button" data-view="share"><span data-icon="share"></span> LokiShare <span class="soon-tag">SOON</span></button>
        <button class="nav-button" data-view="settings"><span data-icon="settings"></span> Settings</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="creator-card"><div class="creator-avatar">LJ</div><div><strong>Creator Edition</strong><small>Made by LokiJ · 2026</small></div><span class="mini-sparkle">✦</span></div>
      <div class="sidebar-bottom"><span class="online-dot"></span> Offline-first workspace <span id="sidebarVersion">v0.1.0</span></div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumbs"><span>WORKSPACE</span> <span class="chevron">/</span> <strong id="topTitle">Overview</strong></div>
        <div class="top-actions"><span class="today" id="dateLabel"></span><span class="top-separator"></span><button class="icon-button" id="topUpdate" title="Check for updates"><span data-icon="refresh"></span></button><div class="top-avatar">L</div></div>
      </header>
      <main id="content" tabindex="-1"><div class="loading">Loading your workspace...</div></main>
      <footer class="footer"><span>✦ &nbsp; Your universe, your rules.</span><span>LOKIVERSE · CREATOR EDITION</span></footer>
    </div>
  </div>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
